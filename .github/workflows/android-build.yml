name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android-demo/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-demo/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Настроить кэш Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Установить Android SDK 33
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Lint, debug APK и release AAB
        working-directory: android-demo
        run: ./gradlew --no-daemon lintDebug assembleDebug bundleRelease

      - name: Опубликовать отчёт lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadrig-lint
          path: android-demo/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Опубликовать debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deadrig-debug-apk
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Опубликовать unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: deadrig-release-aab-unsigned
          path: android-demo/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
