plugins { id 'com.android.application' }

android {
    namespace 'com.deadrig.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.deadrig.app"
        minSdk 21
        targetSdk 33
        versionCode 4
        versionName "0.3.1"
    }

    signingConfigs {
        release {
            storeFile file("/home/user/.toolchain/deadrig.keystore")
            storePassword "deadrig123"
            keyAlias "deadrig"
            keyPassword "deadrig123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
