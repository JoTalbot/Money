plugins { id 'com.android.application' }

// Подпись задаётся только через окружение; секреты никогда не хранятся в репозитории.
def releaseKeystorePath = System.getenv("DEADRIG_KEYSTORE")
def releaseStorePassword = System.getenv("DEADRIG_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("DEADRIG_KEY_ALIAS")
def releaseKeyPassword = System.getenv("DEADRIG_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath != null
        && releaseStorePassword != null
        && releaseKeyAlias != null
        && releaseKeyPassword != null
        && file(releaseKeystorePath).exists()

android {
    namespace 'com.deadrig.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.deadrig.app"
        minSdk 21
        targetSdk 33
        versionCode 16
        versionName "2.0.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
